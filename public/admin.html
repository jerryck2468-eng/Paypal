<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 10px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }

    .refresh {
      background: #d7ad42;
      color: #111;
    }

    .delete {
      background: #e50914;
      color: #fff;
    }

    .count {
      margin-bottom: 15px;
      color: #ccc;
    }

    .table-wrapper {
      overflow-x: auto;
      background: #1b1b1b;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    th {
      background: #222;
      color: #d7ad42;
    }

    td {
      color: #eee;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #aaa;
    }

    .message {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status {
      margin-bottom: 15px;
      color: #ccc;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="topbar">
      <div>
        <h1>Admin Dashboard</h1>
        <div class="status" id="status">Loading submissions...</div>
      </div>

      <button class="refresh" onclick="loadSubmissions()">
        Refresh
      </button>
    </div>

    <div class="count" id="count"></div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Message</th>
            <th>Submitted</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody id="submissionsBody"></tbody>
      </table>
    </div>

  </div>

  <script>
    async function loadSubmissions() {
      const status = document.getElementById("status");
      const count = document.getElementById("count");
      const body = document.getElementById("submissionsBody");

      status.textContent = "Loading submissions...";
      body.innerHTML = "";

      try {
        const response = await fetch("/api/demo-submissions");

        if (!response.ok) {
          throw new Error("Unable to load submissions.");
        }

        const data = await response.json();

        count.textContent = `Total submissions: ${data.count}`;

        if (data.submissions.length === 0) {
          body.innerHTML = `
            <tr>
              <td colspan="5" class="empty">
                No submissions yet.
              </td>
            </tr>
          `;
        } else {
          data.submissions.forEach((submission) => {
            const row = document.createElement("tr");

            row.innerHTML = `
              <td>${escapeHtml(String(submission.id))}</td>
              <td>${escapeHtml(submission.demoEmail)}</td>
              <td class="message">${escapeHtml(submission.demoMessage)}</td>
              <td>${escapeHtml(new Date(submission.submittedAt).toLocaleString())}</td>
              <td>
                <button class="delete" onclick="deleteSubmission(${submission.id})">
                  DELETE
                </button>
              </td>
            `;

            body.appendChild(row);
          });
        }

        status.textContent = "Submissions loaded.";
      } catch (error) {
        status.textContent = error.message;
      }
    }

    async function deleteSubmission(id) {
      const confirmed = confirm(
        "Are you sure you want to delete this submission?"
      );

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(`/api/demo-submissions/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          throw new Error("Unable to delete submission.");
        }

        await loadSubmissions();
      } catch (error) {
        alert(error.message);
      }
    }

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadSubmissions();
  </script>
</body>
</html>
